<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="eye">
<title>ascii eye</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #000; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom));
    text-align: center; font: 12px ui-monospace, Menlo, Consolas, monospace;
    color: #888; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  #hint.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">[ пауза — тап чтобы продолжить ]</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const hint = document.getElementById('hint');

  // ---------- наборы символов ----------
  const SET_DARK   = './\\|()[]{}tfjr';
  const SET_MID    = 'xzcvunYXJUCL';
  const SET_BRIGHT = 'QO0Zmwqpdbkhao';
  const SET_DENSE  = '@#%&8BWM$';
  const SETS = [SET_DARK, SET_MID, SET_BRIGHT, SET_DENSE];

  // ---------- утилиты ----------
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

  function hash2(x, y) {
    let h = (x * 374761393 + y * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
    return lerp(lerp(a, b, u), lerp(c, d, u), v);
  }
  function fbm(x, y) {
    return 0.55 * vnoise(x, y) + 0.3 * vnoise(x * 2.03 + 17.1, y * 2.03 - 9.4) + 0.15 * vnoise(x * 4.1 - 3.3, y * 4.1 + 5.7);
  }

  // ---------- палитра ----------
  const C_SKIN_DULL = hex('#c87850');
  const C_SKIN_WARM = hex('#e0a080');
  const C_CARUNCLE  = hex('#e8a0a0');
  const C_CREASE    = hex('#9a5c44');
  const C_BROW      = hex('#8a5a3a');
  const C_IRIS_A    = hex('#7a8a4a');
  const C_IRIS_B    = hex('#8f9c5a');
  const C_AMBER     = hex('#b89a4a');
  const C_RIM       = hex('#3f4a2a');
  const C_WHITE     = [238, 234, 224];
  const C_PINK      = [205, 150, 140];
  const C_VEIN      = [190, 70, 60];

  // кэш строк цвета (квантование 5 бит на канал)
  const colorCache = new Array(32768);
  function colorStr(r, g, b) {
    r = clamp(r, 0, 255) >> 3; g = clamp(g, 0, 255) >> 3; b = clamp(b, 0, 255) >> 3;
    const k = (r << 10) | (g << 5) | b;
    let s = colorCache[k];
    if (!s) s = colorCache[k] = 'rgb(' + (r << 3 | 4) + ',' + (g << 3 | 4) + ',' + (b << 3 | 4) + ')';
    return s;
  }

  // ---------- сетка ----------
  let W = 0, H = 0, dpr = 1, cols = 0, rows = 0, cw = 0, ch = 0, U = 1, fontPx = 10;
  let cellSeed = new Float32Array(0);
  let starB = new Float32Array(0), starCh = [];

  function resize() {
    const vv = window.visualViewport;
    W = Math.round(vv ? vv.width : window.innerWidth);
    H = Math.round(vv ? vv.height : window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';

    // 60–90 колонок в зависимости от ширины экрана
    cols = clamp(Math.round(W / 6.2), 60, 90);
    cw = W / cols;
    fontPx = cw / 0.6;          // ширина глифа моноширинного шрифта ≈ 0.6em
    ch = fontPx * 1.02;
    rows = Math.ceil(H / ch);

    U = Math.min(W / 2, H * 0.62);   // единица мира: глаз помещается по ширине

    const n = cols * rows;
    cellSeed = new Float32Array(n);
    for (let i = 0; i < n; i++) cellSeed[i] = hash2(i, 911);
    starB = new Float32Array(n);
    starCh = new Array(n);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `bold ${fontPx.toFixed(2)}px ui-monospace, "SF Mono", Menlo, "Roboto Mono", "DejaVu Sans Mono", Consolas, monospace`;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
  }

  // ---------- звёзды (полёт сквозь космос) ----------
  const STAR_N = 320;
  const stars = [];
  function spawnStar(s, far) {
    s.x = (Math.random() * 2 - 1) * 1.6;
    s.y = (Math.random() * 2 - 1) * 2.4;
    s.z = far ? 1 + Math.random() * 0.3 : 0.15 + Math.random() * 1.15;
    s.tw = Math.random() * Math.PI * 2;
    s.ts = 2 + Math.random() * 5;
    return s;
  }
  for (let i = 0; i < STAR_N; i++) stars.push(spawnStar({}, false));

  // ---------- таймлайн ----------
  const LOOP = 12;
  const ZMAX = 26;
  function zoomAt(t) { const p = smooth(1.0, 7.4, t); return Math.exp(Math.log(ZMAX) * Math.pow(p, 1.6)); }

  // ---------- рендер одной клетки ----------
  // результат пишется в эти переменные (без аллокаций)
  let oc = ' ', oR = 0, oG = 0, oB = 0;

  function pickChar(level, i, t, salt) {
    const set = SETS[level];
    const seed = cellSeed[i];
    const k = Math.floor(t * (3 + seed * 5) + seed * 13 + salt);
    return set[Math.floor(hash2(i, k) * set.length)];
  }
  function levelOf(b) { return b < 0.3 ? 0 : b < 0.55 ? 1 : b < 0.8 ? 2 : 3; }

  function dirChar(a) {
    // a — направление в экранных координатах (y вниз), по модулю π
    a = ((a % Math.PI) + Math.PI) % Math.PI;
    const s = Math.PI / 8;
    if (a < s || a >= 7 * s) return '-';
    if (a < 3 * s) return '\\';
    if (a < 5 * s) return '|';
    return '/';
  }

  // ---------- форма глаза ----------
  const EYE_W = 0.95;
  const TILT = 0.07;                 // внешний уголок (справа) приподнят
  function lidTopOpen(x) {
    const ax = Math.abs(x) / EYE_W, k = Math.max(0, 1 - ax * ax);
    return -0.30 * Math.pow(k, x < 0 ? 0.55 : 0.72);   // внутренний уголок мягче, внешний острее
  }
  function lidBot(x) {
    const ax = Math.abs(x) / EYE_W, k = Math.max(0, 1 - ax * ax);
    return 0.27 * Math.pow(k, x < 0 ? 0.7 : 0.95);
  }
  function lidTop(x, c) { return lerp(lidTopOpen(x), lidBot(x) * 0.55, c); }
  function creaseY(x) {
    const ax = Math.abs(x - 0.05) / 1.02, k = Math.max(0, 1 - ax * ax);
    return -(0.30 * Math.pow(k, 0.6) + 0.15 * k);
  }
  function browY(x) { const u = (x - 0.3) / 0.95; return -0.66 - 0.15 * (1 - u * u); }

  let cellWorld = 0.01;     // высота клетки в мировых единицах (зависит от зума)
  let blinkC = 0;           // 0 — открыт, 1 — закрыт

  function shadeEye(i, wx, wy, t, rp) {
    const ri = 0.34;
    const ey = wy + TILT * wx;               // координата в системе глаза
    const top = lidTop(wx, blinkC), bot = lidBot(wx);
    const inEye = Math.abs(wx) < EYE_W && ey > top && ey < bot;
    const r = Math.hypot(wx, wy);

    if (inEye && r < rp) return 2;           // зрачок → космос

    let b, col, ch2 = null;
    if (inEye) {
      const eT = ey - top, eB = bot - ey;
      if (r < ri) {
        // ---- радужка ----
        const rn = (r - rp) / (ri - rp);
        const th = Math.atan2(wy, wx);
        const fib = 0.5 + 0.5 * Math.sin(th * 70 + 5 * vnoise(th * 4 + 7, rn * 4));
        const fib2 = vnoise(Math.cos(th) * 14 + 20 + rn * 3, Math.sin(th) * 14 + rn * 3);
        const f = clamp(0.65 * fib + 0.55 * fib2 - 0.1, 0, 1);
        if (rn < 0.28) col = mix3(C_AMBER, C_IRIS_B, smooth(0.12, 0.28, rn));
        else col = mix3(C_IRIS_A, C_IRIS_B, fib2);
        const rim = smooth(0.78, 0.97, rn);
        col = mix3(col, C_RIM, rim);
        b = 0.5 + 0.42 * f;
        b += 0.15 * Math.exp(-Math.pow((rn - 0.3) / 0.06, 2));
        b *= 1 - 0.45 * rim;
        b *= 1 - 0.5 * smooth(0.09, 0.0, eT);                     // тень от верхнего века
        if (f > 0.7 && rn > 0.05 && rn < 0.9 && hash2(i, Math.floor(t * 2 + cellSeed[i] * 9)) > 0.25) ch2 = dirChar(th);
        b += 0.06 * Math.sin(t * 3 + th * 11 + rn * 6) * f;
        // блики-отражения сверху слева
        const h1 = Math.hypot(wx + 0.115, (wy + 0.10) * 0.9);
        const h2 = Math.hypot(wx + 0.2, wy + 0.02);
        const spec = Math.max(smooth(0.05, 0.02, h1), 0.9 * smooth(0.028, 0.008, h2));
        if (spec > 0) { col = mix3(col, [255, 255, 250], spec); b = lerp(b, 1, spec); }
        if (spec > 0.45) { ch2 = '*'; col = [255, 255, 250]; b = 1; }
      } else {
        // ---- белок ----
        const sh = Math.max(smooth(0.08, 0.0, eT), 0.6 * smooth(0.04, 0.0, eB));
        const corner = smooth(0.45, 0.92, Math.abs(wx));
        col = mix3(C_WHITE, C_PINK, Math.max(corner * 0.7, sh * 0.5));
        b = 0.97 - 0.3 * corner - 0.45 * sh;
        b -= 0.15 * smooth(ri + 0.04, ri, r);
        if (wx < -0.68) {                     // мягкий розовый внутренний уголок
          const p = smooth(-0.68, -0.8, wx);
          col = mix3(col, C_CARUNCLE, p);
          b = lerp(b, 0.62, p);
        }
      }
    } else {
      // ---- кожа (персиковая) ----
      const n = fbm(wx * 3 + 3, wy * 5 - 2);
      const g = clamp(0.35 + 0.45 * n + 0.2 * smooth(1.6, 0.3, Math.hypot(wx * 0.8, wy)) - 0.15 * smooth(-0.2, 0.9, wy), 0, 1);
      col = mix3(C_SKIN_DULL, C_SKIN_WARM, g);
      b = 0.3 + 0.22 * n;
      // мягкая тень века и розовинка у внутреннего уголка
      const dTop = top - ey;
      if (dTop > 0 && Math.abs(wx) < EYE_W + 0.05) b += 0.12 * smooth(0.25, 0.04, dTop) * smooth(0.0, 0.04, dTop);  // светлое веко → контраст с ресницами
      col = mix3(col, C_CARUNCLE, 0.45 * smooth(0.25, 0.0, Math.hypot(wx + EYE_W, ey)));

      const th = cellWorld * 0.6;
      // складка века: тонкая линия ~ - _
      const cx = Math.abs(wx - 0.05);
      if (cx < 0.98 && blinkC < 0.6) {
        const cy = creaseY(wx);
        if (Math.abs(ey - cy) < th) {
          const k = hash2(i, Math.floor(t * 2 + cellSeed[i] * 7));
          ch2 = cx > 0.8 ? (wx > 0 ? '_' : '-') : (k < 0.45 ? '~' : k < 0.8 ? '-' : '_');
          col = C_CREASE; b = 0.75 * (1 - smooth(0.75, 0.98, cx) * 0.5);
        }
      }
      // бровь: мягкая дуга / ' `
      if (wx > -0.92 && wx < 1.1) {
        const by = browY(wx);
        const u = (wx + 0.92) / 2.02;
        const half = lerp(0.06, 0.018, u) + 0.012 * vnoise(wx * 18, 3);
        if (Math.abs(wy - by) < Math.max(half, th)) {
          const hair = hash2(i, Math.floor(t * 1.5 + cellSeed[i] * 5));
          if (u < 0.4) ch2 = hair < 0.75 ? '/' : '\'';
          else if (u < 0.7) ch2 = hair < 0.5 ? '`' : '\'';
          else ch2 = hair < 0.6 ? '\'' : '`';
          col = C_BROW;
          b = 0.85 - 0.25 * u + 0.1 * (hair - 0.5);
        }
      }
    }

    b = clamp(b + (cellSeed[i] - 0.5) * 0.06 + 0.03 * Math.sin(t * 7 + cellSeed[i] * 40), 0, 1);
    oc = ch2 || (b < 0.05 ? ' ' : pickChar(levelOf(b), i, t, 0));
    const m = (!inEye && !ch2) ? 0.55 + 0.7 * b : 0.35 + 0.8 * b;
    oR = col[0] * m; oG = col[1] * m; oB = col[2] * m;
    return 1;
  }

  // ---------- ресницы ----------
  const LASHES = [];
  (function buildLashes() {
    const N = 27;
    for (let j = 0; j < N; j++) {
      const s = j / (N - 1);
      const x = lerp(-0.72, 0.93, Math.pow(s, 0.9)) + (hash2(j, 5) - 0.5) * 0.02;
      const outer = smooth(-0.3, 0.93, x);
      LASHES.push({
        x,
        tilt: lerp(-0.45, 1.15, smooth(-0.75, 0.95, x)) + (hash2(j, 7) - 0.5) * 0.15,
        len: (0.08 + 0.13 * outer) * (0.85 + 0.3 * hash2(j, 9)),
        cluster: Math.floor(j / 3), upper: true, grp: j % 3,
      });
    }
    // пучки: кончики сходятся к среднему наклону группы
    const groups = {};
    for (const l of LASHES) (groups[l.cluster] = groups[l.cluster] || []).push(l.tilt);
    for (const l of LASHES) { const g = groups[l.cluster]; l.ct = g.reduce((a, b) => a + b, 0) / g.length; }
    // нижние: короткие и редкие
    for (let j = 0; j < 9; j++) {
      const x = lerp(-0.25, 0.85, j / 8) + (hash2(j, 11) - 0.5) * 0.05;
      LASHES.push({ x, tilt: lerp(-0.2, 0.6, j / 8), ct: lerp(-0.2, 0.6, j / 8), len: 0.045 + 0.035 * hash2(j, 13) + 0.03 * (j / 8), upper: false });
    }
  })();
  let lashMark = new Uint8Array(0), lashCh = [];

  function rasterLashes(z) {
    if (lashMark.length !== cols * rows) { lashMark = new Uint8Array(cols * rows); lashCh = new Array(cols * rows); }
    lashMark.fill(0);
    const scale = z * U;
    const step = Math.min(cw, ch) * 0.45 / scale;
    for (const l of LASHES) {
      let wx = l.x, wy;
      if (l.upper) wy = lidTop(wx, blinkC) - TILT * wx - 0.004;
      else wy = lidBot(wx) - TILT * wx + 0.004;
      const n = Math.max(2, Math.ceil(l.len / step));
      let prevCell = -1;
      for (let k = 0; k <= n; k++) {
        const s = k / n;
        // угол: наклон от вертикали, к кончику сходится к пучку и загибается вверх
        const ang = lerp(l.tilt, l.ct, s * 0.8) * (1 - 0.55 * s * s);
        let dx = Math.sin(ang), dy;
        if (l.upper) dy = -Math.cos(ang) * (1 - 1.9 * blinkC);   // при моргании ресницы опускаются вместе с веком
        else dy = Math.cos(ang) * 0.9;
        if (k > 0) { wx += dx * l.len / n; wy += dy * l.len / n; }
        const px = W / 2 + wx * scale, py = H / 2 + wy * scale;
        const cx = Math.floor(px / cw), cy = Math.floor(py / ch);
        if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) continue;
        const idx = cy * cols + cx;
        if (idx === prevCell) continue;
        prevCell = idx;
        let c;
        if (k >= n - 1 && l.upper) c = '\'';
        else {
          const a = Math.atan2(-dy, dx) * 180 / Math.PI;          // вверх = 90°
          const aa = a < 0 ? a + 180 : a;
          c = aa > 72 && aa < 108 ? '|' : aa < 90 ? '/' : '\\';
          if (!l.upper && k === n) c = '\'';
        }
        lashMark[idx] = 1; lashCh[idx] = c;
      }
    }
  }

  // ---------- кадр ----------
  const qs = new URLSearchParams(location.search);
  let time = parseFloat(qs.get('t')) || 0, last = performance.now(), paused = qs.has('p');

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) time += dt;
    const t = time % LOOP;

    const z = zoomAt(t);
    const zPrev = zoomAt(Math.max(0, t - 0.05));
    const zoomVel = Math.log(z / zPrev) / 0.05;          // скорость наезда
    const rp = 0.115 + 0.025 * smooth(1.5, 6, t) + 0.01 * Math.sin(time * 1.6) + 0.005 * Math.sin(time * 0.63);  // зрачок «дышит»
    const fade = smooth(0, 0.8, t) * (1 - smooth(11.0, 11.95, t));
    const starVis = smooth(2.2, 4.0, t);
    const eyeGone = z * rp * U > Math.hypot(W, H) * 0.6;

    // ---- звёзды ----
    if (!paused) {
      const speed = 0.06 + 0.22 * zoomVel;
      for (const s of stars) {
        s.z -= speed * dt;
        if (s.z < 0.08) spawnStar(s, true);
      }
    }
    starB.fill(0);
    const ux = U / cw, uy = U / ch;
    for (const s of stars) {
      const px = s.x / s.z, py = s.y / s.z;
      const cx = Math.round(cols / 2 + px * ux * 0.5 - 0.5);
      const cy = Math.round(rows / 2 + py * uy * 0.5 - 0.5);
      if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) { if (!paused && s.z < 0.6) spawnStar(s, true); continue; }
      const near = clamp(1.25 - s.z, 0, 1);
      const tw = 0.55 + 0.45 * Math.sin(time * s.ts + s.tw);
      const bb = clamp((0.25 + 0.85 * near) * tw, 0, 1);
      const idx = cy * cols + cx;
      if (bb <= starB[idx]) continue;
      starB[idx] = bb;
      let c;
      if (bb > 0.75) c = '+';
      else if (bb > 0.55) c = (Math.sin(time * 9 + s.tw) > 0) ? '*' : '+';
      else if (bb > 0.35) c = (s.tw > 3) ? '*' : '\'';
      else c = '.';
      starCh[idx] = c;
      if (bb > 0.8) {      // крестик из - и |
        const arms = [[-1, 0, '-'], [1, 0, '-'], [0, -1, '|'], [0, 1, '|']];
        for (const [dx, dy, a] of arms) {
          const x2 = cx + dx, y2 = cy + dy;
          if (x2 < 0 || y2 < 0 || x2 >= cols || y2 >= rows) continue;
          const j = y2 * cols + x2;
          const ab = bb * 0.6;
          if (ab > starB[j]) { starB[j] = ab; starCh[j] = a; }
        }
      }
    }

    // ---- моргание ----
    {
      // моргания в 0.9 с и 3.4 с цикла — пока глаз виден целиком
      let bl = 0;
      for (const t0 of [0.9, 3.4]) {
        const ph = t - t0;
        if (ph >= 0 && ph < 0.34) bl = ph < 0.11 ? smooth(0, 0.11, ph) : 1 - smooth(0.11, 0.34, ph);
      }
      blinkC = bl * (1 - smooth(2.2, 3.0, z));
    }
    cellWorld = ch / (U * z);
    if (!eyeGone) rasterLashes(z);

    // ---- планета ----
    const pGrow = smooth(7.0, 9.4, t);
    const PR = (0.62 + 0.04 * Math.sin(time * 0.7)) * pGrow;   // радиус в единицах U
    const rot = time * 0.35;

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    let lastStyle = '';
    for (let row = 0; row < rows; row++) {
      const py = (row + 0.5) * ch;
      const sy = (py - H / 2) / U;
      for (let colI = 0; colI < cols; colI++) {
        const i = row * cols + colI;
        const px = (colI + 0.5) * cw;
        const sx = (px - W / 2) / U;

        let kind = 2;
        if (!eyeGone) {
          kind = shadeEye(i, sx / z, sy / z, time, rp);
          if (lashMark[i]) {
            // ресница: тёмный штрих, вырезанный из светлой кожи
            oc = lashCh[i]; oR = 92; oG = 66; oB = 66; kind = 3;
          }
        }

        if (kind === 2) {
          // ---- космос внутри зрачка ----
          oc = ' '; oR = oG = oB = 0;
          let done = false;
          if (PR > 0.001) {
            const d = Math.hypot(sx, sy) / PR;
            if (d < 1) {
              const nx = sx / PR, ny = sy / PR, nz = Math.sqrt(1 - d * d);
              const lon = Math.atan2(nx, nz) + rot, lat = Math.asin(clamp(ny, -1, 1));
              const tex = fbm(lon * 2.2 + 10, lat * 3.2);
              const band = 0.5 + 0.5 * Math.sin(lat * 7 + tex * 4);
              const light = Math.pow(nz, 0.7) * (0.85 + 0.15 * (-nx * 0.4 - ny * 0.5 + nz * 0.77));
              let b = clamp(light * (0.55 + 0.35 * tex + 0.2 * band) + 0.04, 0, 1);
              b *= smooth(0, 0.6, pGrow) ;
              b = clamp(b + (cellSeed[i] - 0.5) * 0.06, 0, 1);
              const cDark = [70, 6, 6], cMid = [215, 40, 28], cHot = [255, 150, 95];
              const col = b < 0.6 ? mix3(cDark, cMid, b / 0.6) : mix3(cMid, cHot, (b - 0.6) / 0.4);
              const m = 0.65 + 0.6 * b;
              oc = b < 0.04 ? '.' : pickChar(levelOf(b), i, time * 0.6, 0);
              oR = col[0] * m; oG = col[1] * m; oB = col[2] * m;
              done = true;
            } else if (d < 1.45) {
              const g = Math.pow(1 - (d - 1) / 0.45, 2) * smooth(0.2, 1, pGrow);
              const pulse = 0.85 + 0.15 * Math.sin(time * 2 + d * 8);
              const gb = g * pulse;
              const sb = starB[i] * starVis;
              if (gb > 0.12 && gb * 0.9 > sb) {
                oc = gb > 0.5 ? pickChar(1, i, time, 3) : (hash2(i, Math.floor(time * 6)) > 0.5 ? '.' : ':');
                if (gb > 0.75) oc = pickChar(0, i, time, 5);
                oR = 255 * gb; oG = 45 * gb; oB = 30 * gb;
                done = true;
              }
            }
          }
          if (!done) {
            const sb = starB[i] * starVis;
            if (sb > 0.05) {
              oc = starCh[i];
              const warm = cellSeed[i];
              oR = 255 * sb; oG = (225 + 30 * warm) * sb; oB = (205 + 50 * (1 - warm)) * sb;
            } else continue;
          }
        }

        if (oc === ' ') continue;
        const st = colorStr(oR * fade, oG * fade, oB * fade);
        if (st !== lastStyle) { ctx.fillStyle = st; lastStyle = st; }
        ctx.fillText(oc, px, py);
      }
    }

    requestAnimationFrame(frame);
  }

  // ---------- управление ----------
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    paused = !paused;
    hint.classList.toggle('on', paused);
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { paused = !paused; hint.classList.toggle('on', paused); }
  });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  resize();
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
